<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="doc-title">KubeSphere 商业许可</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;510;590&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header" id="site-header">
      <div id="a11y-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
      <h1 id="page-heading">KubeSphere 商业许可</h1>
      <div class="toolbar">
        <div class="toolbar-row toolbar-row--split">
          <div class="search-field" role="search">
            <svg
              class="search-field__icon"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input
              type="search"
              id="filter"
              placeholder=""
              autocomplete="off"
              class="search-input"
              inputmode="search"
              enterkeyhint="search"
            />
          </div>
          <div class="toolbar-secondary">
            <div class="toolbar-trailing">
              <a
                class="toolbar-propose-link"
                href="propose.html"
                >套餐修订</a>
              <a
                id="license-issue-link"
                class="toolbar-issue-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="toolbar-issue-link__text" aria-hidden="true"></span>
                <svg
                  class="toolbar-issue-link__icon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"
                  />
                  <path d="M12 7v4" />
                  <path d="M12 15h.01" />
                </svg>
              </a>
              <div class="locale-switch" id="locale-switch" role="group" aria-label="Language">
                <div class="locale-switch__segments">
                  <button type="button" class="locale-btn" data-locale="zh" aria-pressed="false">
                    中文
                  </button>
                  <button type="button" class="locale-btn" data-locale="en" aria-pressed="false">
                    EN
                  </button>
                </div>
                <button type="button" class="locale-toggle-compact" id="locale-toggle-compact"></button>
              </div>
            </div>
          </div>
        </div>
        <nav class="tabs" id="tabs" role="tablist" aria-orientation="horizontal">
          <button
            type="button"
            id="tab-bundles"
            class="tab active"
            data-tab="bundles"
            data-i18n-tab="bundles"
            role="tab"
            aria-selected="true"
            aria-controls="panel-bundles"
          ></button>
          <button
            type="button"
            id="tab-products"
            class="tab"
            data-tab="products"
            data-i18n-tab="products"
            role="tab"
            aria-selected="false"
            aria-controls="panel-products"
          ></button>
          <button
            type="button"
            id="tab-extensions"
            class="tab"
            data-tab="extensions"
            data-i18n-tab="extensions"
            role="tab"
            aria-selected="false"
            aria-controls="panel-extensions"
          ></button>
        </nav>
      </div>
    </header>

    <main>
      <section id="panel-bundles" class="panel active" role="tabpanel" aria-labelledby="tab-bundles">
        <div id="bundle-list-wrap">
          <div id="grid-bundles" class="catalog-grid catalog-grid--bundles"></div>
          <div id="empty-filter-bundles" class="catalog-empty-state" hidden role="status"></div>
        </div>
        <div id="bundle-detail-wrap" class="entity-detail-wrap bundle-detail-wrap" hidden>
          <div id="bundle-detail-root"></div>
        </div>
        <div id="bundle-compare-wrap" class="entity-detail-wrap bundle-detail-wrap bundle-compare-wrap" hidden>
          <div id="bundle-compare-root"></div>
        </div>
      </section>
      <section id="panel-products" class="panel" role="tabpanel" aria-labelledby="tab-products" hidden>
        <div id="product-list-wrap">
          <div id="grid-products" class="catalog-grid catalog-grid--products"></div>
          <div id="empty-filter-products" class="catalog-empty-state" hidden role="status"></div>
        </div>
        <div id="product-detail-wrap" class="entity-detail-wrap" hidden>
          <div id="product-detail-root"></div>
        </div>
      </section>
      <section id="panel-extensions" class="panel" role="tabpanel" aria-labelledby="tab-extensions" hidden>
        <div id="extension-list-wrap">
          <div class="table-shell">
            <table class="ext-table">
              <thead>
                <tr>
                  <th class="col-id" data-i18n-th="id">id</th>
                  <th data-i18n-th="name">名称</th>
                  <th class="col-category" data-i18n-th="extCategory">分类</th>
                  <th class="col-github" data-i18n-th="extGithub" scope="col">GitHub</th>
                  <th class="col-version" data-i18n-th="extVersion">版本</th>
                  <th class="col-env" data-i18n-th="extEnv">环境要求</th>
                </tr>
              </thead>
              <tbody id="tbody-extensions"></tbody>
            </table>
          </div>
          <div id="empty-filter-extensions" class="catalog-empty-state" hidden role="status"></div>
        </div>
        <div id="extension-detail-wrap" class="entity-detail-wrap" hidden>
          <div id="extension-detail-root"></div>
        </div>
      </section>

      <div id="bundle-compare-drawer" class="bundle-compare-drawer" hidden aria-hidden="true">
        <div class="bundle-compare-drawer__backdrop" aria-hidden="true"></div>
        <div
          class="bundle-compare-drawer__sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="bundle-compare-drawer-title"
        >
          <div class="bundle-compare-drawer__handle" aria-hidden="true"></div>
          <header class="bundle-compare-drawer__head">
            <h2 id="bundle-compare-drawer-title" class="bundle-compare-drawer__title"></h2>
            <button
              type="button"
              id="bundle-compare-drawer-close"
              class="bundle-compare-drawer__close"
              aria-label="Close"
            >
              ×
            </button>
          </header>
          <p id="bundle-compare-drawer-hint" class="bundle-compare-drawer__hint"></p>
          <div class="bundle-compare-drawer__search">
            <input
              type="search"
              id="bundle-compare-drawer-filter"
              class="bundle-compare-drawer__input search-input"
              autocomplete="off"
            />
          </div>
          <ul id="bundle-compare-drawer-list" class="bundle-compare-drawer__list"></ul>
          <p id="bundle-compare-drawer-empty" class="bundle-compare-drawer__empty" hidden></p>
        </div>
      </div>

      <footer class="site-meta" id="site-meta">
        <p id="build-meta" class="meta meta--footer" role="status" aria-live="polite">加载中…</p>
      </footer>
    </main>

    <script src="catalog.js"></script>
  </body>
</html>
